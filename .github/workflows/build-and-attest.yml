name: Build and attest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write       # needed to request the signing certificate (Sigstore)
      attestations: write   # needed to store the attestation
      artifact-metadata: write   # needed for linked-artifact records
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      PUBLISH_DIR: publish
      ZIP_PATH: dist/DigitalLogin-win-x64.zip

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install the .NET MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Restore
        run: dotnet restore DigitalLogin.sln

      - name: Build
        run: dotnet build DigitalLogin.sln -c Release --no-restore

      - name: Test
        run: dotnet test DigitalLogin.Tests -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publish the Windows app (unpackaged, self-contained)
        run: >
          dotnet publish DigitalLogin.Maui/DigitalLogin.Maui.csproj
          -c Release
          -f net10.0-windows10.0.19041.0
          -r win-x64
          --self-contained true
          -p:WindowsPackageType=None
          -p:WindowsAppSDKSelfContained=true
          -o $env:PUBLISH_DIR

      - name: Zip the published app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "$env:PUBLISH_DIR/*" -DestinationPath $env:ZIP_PATH -Force

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 $env:ZIP_PATH).Hash.ToLower()
          "$hash  $(Split-Path $env:ZIP_PATH -Leaf)" | Out-File -FilePath dist/SHA256SUMS.txt -Encoding ascii

      - name: Generate artifact attestation (build provenance)
        uses: actions/attest@v4
        with:
          subject-path: 'dist/DigitalLogin-win-x64.zip'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DigitalLogin-win-x64
          path: dist/
          if-no-files-found: error
